name: gocli
services:
  go:
    container_name: go
    build:
      context: ./go
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../
        target: /app
      - type: volume
        source: codex-data
        target: /root/.codex
      - type: bind
        source: ../../staff-search-app
        target: /app/staff-search-app
    tty: true

volumes:
  codex-data: